name: Build Croak Squad APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Android SDK for Buildozer
        shell: bash
        run: |
          set -eux

          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export SDK_PATH="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$HOME/.buildozer/android/platform"
          ln -sfn "$ANDROID_HOME" "$SDK_PATH"

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Installing cmdline-tools latest"
            yes | sdkmanager --sdk_root="$ANDROID_HOME" "cmdline-tools;latest" || true
          fi

          mkdir -p "$SDK_PATH/tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$SDK_PATH/tools/bin/sdkmanager"

          yes | "$SDK_PATH/tools/bin/sdkmanager" --sdk_root="$SDK_PATH" --licenses >/dev/null || true
          "$SDK_PATH/tools/bin/sdkmanager" --sdk_root="$SDK_PATH" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -x "$SDK_PATH/tools/bin/sdkmanager"
          echo "Android SDK is ready for Buildozer"

      - name: Build APK
        uses: digreatbrian/buildozer-action@v2
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        with:
          python-version: '3.11'
          buildozer-cmd: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CroakSquad-Android-APK
          path: bin/*.apk
          if-no-files-found: error
