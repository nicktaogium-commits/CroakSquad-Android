
name: Build Croak Squad APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Tao APK
        uses: digreatbrian/buildozer-action@v2
        with:
          python-version: '3.11'
          buildozer-cmd: buildozer -v android debug

      - name: Tai APK ve GitHub
        uses: actions/upload-artifact@v4
        with:
          name: CroakSquad-Android-APK
          path: ./bin/*.apk
          if-no-files-found: error
